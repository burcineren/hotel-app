<div class="dash-card">
  <div class="card-header-row">
    <h3 class="card-title">Overview</h3>
    <span class="badge-today">Today</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card stat-green">
      <div class="stat-icon-wrap">
        <i class="bi bi-box-arrow-in-right"></i>
      </div>
      <div class="stat-body">
        <p class="stat-label">Check-In</p>
        <p class="stat-value">23</p>
        <p class="stat-trend trend-up">
          <i class="bi bi-arrow-up-short"></i> 24% vs last week
        </p>
      </div>
    </div>

    <div class="stat-card stat-red">
      <div class="stat-icon-wrap">
        <i class="bi bi-box-arrow-right"></i>
      </div>
      <div class="stat-body">
        <p class="stat-label">Check-Out</p>
        <p class="stat-value">21</p>
        <p class="stat-trend trend-down">
          <i class="bi bi-arrow-down-short"></i> 11% vs last week
        </p>
      </div>
    </div>

    <div class="stat-card stat-blue">
      <div class="stat-icon-wrap">
        <i class="bi bi-door-open"></i>
      </div>
      <div class="stat-body">
        <p class="stat-label">Available</p>
        <p class="stat-value">25</p>
        <p class="stat-trend trend-down">
          <i class="bi bi-arrow-down-short"></i> 41% vs last week
        </p>
      </div>
    </div>

    <div class="stat-card stat-amber">
      <div class="stat-icon-wrap">
        <i class="bi bi-calendar-check"></i>
      </div>
      <div class="stat-body">
        <p class="stat-label">Reserved</p>
        <p class="stat-value">12</p>
        <p class="stat-trend trend-up">
          <i class="bi bi-arrow-up-short"></i> 59% vs last week
        </p>
      </div>
    </div>
  </div>

  <div class="room-gallery">
    <p class="gallery-title">Room Gallery</p>
    <div class="gallery-grid">
      @for (image of images; track $index) {
        <div class="gallery-item">
          <img [src]="image.src" [alt]="image.alt" class="gallery-img" />
        </div>
      }
    </div>
  </div>
</div>
