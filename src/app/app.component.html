<div class="app-shell">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      class="app-sidenav"
      [mode]="isMobile ? 'over' : 'side'"
      [opened]="!isMobile"
    >
      <sidebar></sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="top-bar">
        <button mat-icon-button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
        <header></header>
      </div>
      <main class="page-body">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
<be-layout-loader></be-layout-loader>
